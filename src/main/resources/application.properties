spring.application.name=PublicHospitalInfoManager
server.port=8080

# H2 database saved in the data folder so it is not lost on restart
spring.datasource.url=jdbc:h2:file:./data/hospitaldb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# open the website in the browser when the app starts
hospital.open-browser=true

# code word only nurses know, used at the kiosk when a patient has no ID
hospital.nurse-code=NURSE2026
